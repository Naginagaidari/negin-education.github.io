    .hero h2 {

    }

    .hero p {

    }

    .button {

    }

    }

      margin-bottom: 45px;
    }

    .section-title h2 {
      color: #145c50;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #607d8b;
    }

    .about {
      background: white;
    }

    .about-content {
      max-width: 900px;
      margin: auto;
      text-align: center;
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;

      text-align: center;
    }

    .card .icon {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .card h3 {
      color: #176b5c;
      margin-bottom: 10px;
    }

    .mission {
      background: #eaf5f1;
      text-align: center;
    }

    .mission p {
      max-width: 850px;
      margin: auto;
      font-size: 20px;
    }

    .contact {
      background: white;
    }

    .contact-box {
      max-width: 700px;
      margin: auto;
      text-align: center;
      font-size: 18px;
    }

    .contact-box p {
      margin: 12px 0;
    }

    footer {
      background: #123d36;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    footer p {
      margin: 5px 0;
    }

    @media (max-width: 800px) {
      header {
        flex-direction: column;
      }

      nav {
        justify-content: center;
        gap: 12px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero h2 {
        font-size: 21px;
      }

      .hero p {
        font-size: 17px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      section {
        padding: 50px 6%;
      }
    }
  </style>
</head>
